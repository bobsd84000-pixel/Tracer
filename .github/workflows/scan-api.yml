name: Scan API CI

on:
  push:
    paths:
      - 'api/**'
      - 'scripts/**'
      - 'server.js'
      - 'package.json'
      - '.github/workflows/scan-api.yml'
  pull_request:
    paths:
      - 'api/**'
      - 'scripts/**'
      - 'server.js'
      - 'package.json'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - run: npm install
      - run: npm run build
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Vérifier la syntaxe
        run: |
          for f in api/*.js server.js; do node --check "$f"; done
          python3 -m py_compile scripts/scan_api.py
          for f in scripts/*.sh; do bash -n "$f"; done
      - name: Tester les refus de l'API
        run: node scripts/test-api.js
